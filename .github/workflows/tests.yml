name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only reads the code. Runs the plain-Node tests on the systems the program is built for (Windows with an Intel/AMD or an ARM chip, macOS, and Linux for the tests alone);
# the names of failed tests are also written as an annotation.
permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/run-tests.js
      # How long the watchers take on this system. Information only: the numbers are written as an annotation.
      - name: Speed of the watchers
        if: runner.os != 'Linux'
        continue-on-error: true
        run: node test/bench-os.js

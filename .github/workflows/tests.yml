name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only reads the code. Runs the plain-Node tests on the three systems the program is built for;
# the names of failed tests are also written as an annotation.
permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/run-tests.js

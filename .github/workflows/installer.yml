name: Installers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release (tag v<version from package.json>) with both installers'
        type: boolean
        default: false

# Builds only read the code; only the release job may write (to publish the release).
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node test/run-tests.js
      - run: npx --yes electron-builder@26 --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: AgathOS-Windows
          path: dist/*.exe
      # Starts the built app once, with a few bad files in a throw-away home folder, and checks that it
      # scans, finds them, answers and has no hidden errors. A failure here stops the release.
      - name: Smoke test of the built app
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1.56.0
          node test/smoke.js dist/win-unpacked/AgathOS.exe

  # Windows on an ARM chip (Snapdragon laptops): its own installer, built and checked on a real ARM Windows machine. The Intel
  # installer runs there too (slower), so a problem here does not stop the other installers from being released.
  windows-arm:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node test/run-tests.js
      - run: npx --yes electron-builder@26 --win nsis --arm64 --publish never
      # A name that AgathOS versions before this one do not take for their own installer.
      - name: Name the installer for the ARM chip
        shell: bash
        run: |
          set -e
          f="$(ls dist/AgathOS-Setup-*.exe | head -1)"
          mv "$f" "dist/AgathOS-Windows-ARM64-Setup-${f#dist/AgathOS-Setup-}"
          ls dist
      - uses: actions/upload-artifact@v4
        with:
          name: AgathOS-Windows-ARM64
          path: dist/AgathOS-Windows-ARM64-Setup-*.exe
      - name: Smoke test of the built app
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1.56.0
          node test/smoke.js dist/win-arm64-unpacked/AgathOS.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node test/run-tests.js
      - run: npx --yes electron-builder@26 --mac dmg --arm64 --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: AgathOS-macOS
          path: dist/*.dmg
      # The runner is an Apple-chip Mac, so the arm64 build is the one that is started.
      - name: Smoke test of the built app
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1.56.0
          APP="$(find dist -maxdepth 5 -path '*mac-arm64*' -path '*Contents/MacOS/AgathOS' | head -1)"
          if [ -z "$APP" ]; then
            echo "::error title=Smoke test::the built app was not found. dist holds: $(find dist -maxdepth 4 | head -40 | tr '\n' ' ')"
            exit 1
          fi
          echo "starting $APP"
          node test/smoke.js "$APP"

  release:
    # The ARM installer is added when it was built; a failed or skipped ARM job does not hold back the others.
    needs: [windows, windows-arm, mac]
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.mac.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || inputs.release) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Text of the release
        run: |
          v="${{ steps.v.outputs.version }}"
          {
            echo "Windows: AgathOS-Setup-$v.exe"
            if ls out/AgathOS-Windows-ARM64-Setup-*.exe > /dev/null 2>&1; then
              echo "Windows on an ARM chip (Snapdragon): AgathOS-Windows-ARM64-Setup-$v.exe"
            fi
            echo "Mac with Apple chip (M1 and newer): AgathOS-$v-arm64.dmg"
            echo "Mac with Intel chip: AgathOS-$v-x64.dmg"
          } > release-text.md
          cat release-text.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: AgathOS ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release-text.md
          files: out/*

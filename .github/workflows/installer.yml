name: Installers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release (tag v<version from package.json>) with both installers'
        type: boolean
        default: false

# Builds only read the code; only the release job may write (to publish the release).
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node test/run-tests.js
      - run: npx --yes electron-builder@26 --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: AgathOS-Windows
          path: dist/*.exe
      # Starts the built app once, with a few bad files in a throw-away home folder, and checks that it
      # scans, finds them, answers and has no hidden errors. A failure here stops the release.
      - name: Smoke test of the built app
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1.56.0
          node test/smoke.js dist/win-unpacked/AgathOS.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node test/run-tests.js
      - run: npx --yes electron-builder@26 --mac dmg --arm64 --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: AgathOS-macOS
          path: dist/*.dmg
      # The runner is an Apple-chip Mac, so the arm64 build is the one that is started.
      - name: Smoke test of the built app
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1.56.0
          APP="$(find dist -maxdepth 5 -path '*mac-arm64*' -path '*Contents/MacOS/AgathOS' | head -1)"
          if [ -z "$APP" ]; then
            echo "::error title=Smoke test::the built app was not found. dist holds: $(find dist -maxdepth 4 | head -40 | tr '\n' ' ')"
            exit 1
          fi
          echo "starting $APP"
          node test/smoke.js "$APP"

  release:
    needs: [windows, mac]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: AgathOS ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            Windows: AgathOS-Setup-${{ steps.v.outputs.version }}.exe
            Mac with Apple chip (M1 and newer): AgathOS-${{ steps.v.outputs.version }}-arm64.dmg
            Mac with Intel chip: AgathOS-${{ steps.v.outputs.version }}-x64.dmg
          files: out/*
